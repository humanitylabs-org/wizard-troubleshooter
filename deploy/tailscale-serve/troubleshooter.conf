# Drop-in for a box whose HTTPS front door is Tailscale Serve (no Caddy, no separate sign-in service), e.g. a
# Runtipi/WAM box. Copy to ~/.config/systemd/user/wizard-troubleshooter.service.d/host.conf and fill in names.
[Service]
Environment=WIZARD_PUBLIC_NAME=<box>.<tailnet>.ts.net
Environment=WIZARD_PRIVATE_ORIGINS=https://<box>.<tailnet>.ts.net:8444,https://<box>.<tailnet>.ts.net:8806
# Owner gate: Tailscale Serve proxies from loopback and sets X-Forwarded-For to the peer; whois confirms the person.
Environment=TROUBLESHOOT_FRONT=tailscale-serve
Environment=TROUBLESHOOT_OWNERS=<owner login, e.g. you@example.com>
Environment=TS_SOCKET=/run/tailscale/tailscaled.sock
Environment=TAILSCALE_UNIT=
Environment=GATEWAY_MODE=tailscale-serve
Environment=GATEWAY_PORT=8444
Environment=GATEWAY_UNIT=
Environment=AUTH_PORT=
# The Wizard shell (WAM wizard-ux) and the Agent Service run as Docker containers on the host network.
Environment=SHELL_PORT=8796
Environment=SHELL_CONTAINER=wizard-ux_wizardapps-wizard-ux-1
Environment=AGENT_PORT=8798
Environment=AGENT_CONTAINER=wizard-agent-service_wizardapps-wizard-agent-service-1
Environment=HERMES_PORT=8642
Environment=HERMES_UNIT=hermes-gateway.service
# Rootless Docker
Environment=DOCKER_BIN=%h/bin/docker
Environment=PATH=%h/bin:%h/.local/bin:/usr/local/bin:/usr/bin:/bin
Environment=DOCKER_HOST=unix:///run/user/1000/docker.sock
# Connection apps (sign-ins used in place, never copied)
Environment=CLAUDE_BIN=%h/.local/bin/claude
Environment=CHATGPT_AUTH_FILE=%h/.hermes/auth.json
Environment=TINFOIL_URL=http://127.0.0.1:18804
Environment=TINFOIL_CONTAINER=wizard-tinfoil_wizardapps-wizard-tinfoil-1
