<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<title>Fix Wizard</title>
<style>
:root {
  --bg: var(--wz-bg, #0b0d12); --surface: var(--wz-surface, #151922); --surface2: var(--wz-surface-2, #1c2130);
  --text: var(--wz-text, #e8eaf0); --muted: var(--wz-text-muted, #9aa3b5); --line: var(--wz-border, #262c3a);
  --accent: var(--wz-accent, #e8eaf0); --ok: #4cc38a; --warn: #e5b454; --bad: #ef6b6b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
body { display: flex; flex-direction: column; height: 100dvh; }
body.hosted, html:has(> body.hosted) { background: transparent; }
/* Inside a Wizard window the window's own title bar and Back handle navigation. */
body.hosted a.back { display: none; }
button { font: inherit; color: inherit; }
header { flex: none; display: flex; align-items: center; gap: 6px; padding: max(8px, env(safe-area-inset-top)) 12px 8px; }
header h1 { font-size: 16px; font-weight: 600; margin: 0; flex: 1; }
a.back { color: var(--text); text-decoration: none; font-size: 24px; line-height: 1; padding: 4px 8px 6px 2px; }
.pill { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); background: none; border: 0; padding: 8px 4px 8px 8px; cursor: pointer; max-width: 60vw; }
.pill span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted); }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
#scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.wrap { max-width: 680px; margin: 0 auto; padding: 8px 16px 16px; min-height: 100%; display: flex; flex-direction: column; }
.welcome { margin-top: auto; padding: 0 0 8px; }
.welcome .big { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
.welcome .sub { color: var(--muted); font-size: 15px; }
.welcome .alert { margin-top: 14px; font-size: 14px; display: flex; gap: 10px; color: var(--text); }
.welcome .alert span:last-child { min-width: 0; overflow-wrap: anywhere; }
.welcome .alert .dot { margin-top: 7px; }
.chips { display: flex; flex-direction: column; gap: 6px; margin-top: 18px; }
.chip { text-align: left; background: var(--surface); border: 0; border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.chip.main { background: var(--text); color: var(--bg); font-weight: 600; }
.log { display: flex; flex-direction: column; gap: 14px; }
.log:empty { display: none; }
.msg { white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.owner { align-self: flex-end; max-width: 85%; background: var(--surface2); padding: 9px 13px; border-radius: 16px 16px 4px 16px; }
.msg.agent { align-self: stretch; }
.msg.agent code { background: var(--surface); padding: 1px 5px; border-radius: 5px; font-size: 14px; }
.msg .who { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.signin, .note { font-size: 14px; color: var(--muted); }
.signin { display: flex; flex-direction: column; gap: 8px; color: var(--text); }
.signin .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.act { min-height: 40px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 10px; border: 0; background: var(--surface2); color: var(--text); text-decoration: none; cursor: pointer; font-size: 14px; }
.working { font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.working .step { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spin { width: 13px; height: 13px; flex: none; border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: s .9s linear infinite; }
@keyframes s { to { transform: rotate(360deg); } }
.after { display: flex; gap: 6px; flex-wrap: wrap; }
.after .chip { padding: 8px 12px; font-size: 14px; }
footer { flex: none; padding: 4px 16px max(12px, env(safe-area-inset-bottom)); }
.dock { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
/* Model picker: one tap, right above the message box. */
.picker { display: flex; gap: 2px; padding: 3px; background: var(--surface); border-radius: 12px; }
.seg { flex: 1 1 0; min-width: 0; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: 4px 4px; border: 0; border-radius: 9px; background: none; color: var(--muted); cursor: pointer; line-height: 1.2; }
.seg b { font-size: 14px; font-weight: 600; }
.seg small { font-size: 11px; opacity: .8; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seg[aria-checked="true"] { background: var(--surface2); color: var(--text); }
.seg.off { opacity: .6; }
.seg.off b { font-weight: 500; }
.seg.off[aria-checked="true"] { opacity: .75; }
.composer { display: flex; gap: 8px; align-items: flex-end; }
textarea { flex: 1; min-height: 44px; max-height: 160px; resize: none; font: inherit; color: var(--text); background: var(--surface); border: 0; border-radius: 22px; padding: 10px 16px; outline: none; }
textarea:focus { box-shadow: 0 0 0 1px var(--line); }
button.send { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--text); color: var(--bg); font-size: 19px; font-weight: 700; cursor: pointer; }
button.send.stop { background: var(--surface2); color: var(--text); font-size: 14px; }
button:disabled { opacity: .5; cursor: default; }
/* Details sheet: technical things, out of the way. Flat sections, no boxes. */
.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; z-index: 10; }
.sheet.open { display: block; }
.sheet .panel { position: absolute; left: 0; right: 0; bottom: 0; max-height: 82dvh; overflow-y: auto; background: var(--bg); border-radius: 16px 16px 0 0; padding: 6px 16px 0; max-width: 680px; margin: 0 auto; }
.sheet h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 18px 0 2px; }
.row { display: flex; gap: 10px; padding: 7px 0; align-items: flex-start; font-size: 14px; }
.row .dot { margin-top: 7px; } .row .m { flex: 1; min-width: 0; }
.row .d { color: var(--muted); overflow-wrap: anywhere; }
.row a { color: var(--text); font-size: 13px; white-space: nowrap; padding-top: 1px; }
.fixes { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 6px; }
.past { display: block; width: 100%; text-align: left; font-size: 14px; background: none; border: 0; padding: 7px 0; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.small { font-size: 12px; color: var(--muted); }
.sheet .bottom { position: sticky; bottom: 0; background: linear-gradient(transparent, var(--bg) 14px); padding: 22px 0 max(12px, env(safe-area-inset-bottom)); margin-top: 6px; }
.sheet .bottom .act { width: 100%; justify-content: center; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <a class="back" id="back" href="/wizard-os-home/" aria-label="Back to Wizard">‹</a>
  <h1>Fix Wizard</h1>
  <button class="pill" id="pill" type="button" aria-label="Show system details"><span class="dot" id="pillDot"></span><span id="pillText">Checking…</span></button>
</header>

<div id="scroll"><div class="wrap">
  <section class="welcome" id="welcome">
    <div class="big">What's wrong?</div>
    <div class="sub">Tell me and I'll fix it, even when Wizard's normal chat is down.</div>
    <div class="alert" id="alert" hidden><span class="dot bad"></span><span id="alertText"></span></div>
    <div class="chips" id="chips">
      <button class="chip main" type="button" data-say="My Wizard is down, please fix it.">My Wizard is down</button>
      <button class="chip" type="button" data-say="My messages won't send in Wizard. Please fix it.">Messages won't send</button>
      <button class="chip" type="button" data-say="My agent isn't replying in Wizard. Please fix it.">My agent isn't replying</button>
      <button class="chip" type="button" data-say="Wizard is really slow. Please find out why and fix it.">Wizard is slow</button>
    </div>
  </section>
  <div class="log" id="log"></div>
</div></div>

<footer><div class="dock">
  <div class="picker" id="picker" role="radiogroup" aria-label="Who answers"></div>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Describe the problem…" aria-label="Message"></textarea>
    <button class="send" id="send" type="button" aria-label="Send">↑</button>
  </div>
</div></footer>

<div class="sheet" id="sheet"><div class="panel">
  <h2>Connection to your agent</h2>
  <div id="checks"></div>
  <h2>Sign-ins</h2>
  <div id="acct"></div>
  <h2>Manual fixes</h2>
  <div class="fixes" id="fixes"></div>
  <div id="pastWrap" hidden><h2>Earlier repair chats</h2><div id="past"></div></div>
  <div id="incWrap" hidden><h2>Recently</h2><div id="incidents"></div></div>
  <div class="bottom"><button class="act" id="closeSheet" type="button">Done</button></div>
</div></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const md = s => esc(s).replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  const H = { 'Content-Type': 'application/json', 'X-Wizard-Troubleshoot': '1' };
  const NAMES = { claude: 'Claude', chatgpt: 'ChatGPT', tinfoil: 'Tinfoil' };
  const CACHE = 'wizard-troubleshoot-engines'; // last known picker, painted instantly; the server holds the real choice
  if (window.self !== window.top) document.body.classList.add('hosted');

  // Model picker: every provider, its real model in quieter text, the owner's choice saved on the server.
  let engines = [], selected = null;
  function paintPicker() {
    $('picker').hidden = !engines.length;
    $('picker').innerHTML = engines.map(a => `<button class="seg${a.ok ? '' : ' off'}" type="button" role="radio" data-engine="${esc(a.engine)}" aria-checked="${a.engine === selected}"${a.ok ? '' : ' aria-disabled="true"'} title="${esc(a.ok ? a.name + (a.modelLabel ? ' · ' + a.modelLabel : '') : a.reason)}"><b>${esc(a.name)}</b><small>${esc(a.ok ? (a.modelLabel || 'Ready') : a.reason)}</small></button>`).join('');
  }
  function setEngines(list, sel) {
    engines = list || []; selected = sel || selected || engines.find(a => a.ok)?.engine || 'claude';
    try { localStorage.setItem(CACHE, JSON.stringify({ engines, selected })); } catch {}
    paintPicker();
  }
  try { const c = JSON.parse(localStorage.getItem(CACHE) || 'null'); if (c?.engines) { engines = c.engines; selected = c.selected; paintPicker(); } } catch {}
  async function pick(engine) {
    if (!NAMES[engine] || engine === selected) return;
    selected = engine; paintPicker();
    try { await api('engine', { method: 'POST', headers: H, body: JSON.stringify({ engine }) }); setEngines(engines, engine); } catch {}
  }
  $('picker').addEventListener('click', e => {
    const b = e.target.closest('[data-engine]'); if (!b || b.getAttribute('aria-disabled') === 'true') return;
    pick(b.dataset.engine);
  });
  async function loadEngines() { try { const r = await api('engines'); setEngines(r.engines, r.selected); } catch {} }

  // Back: one step at a time. Details sheet → chat → Wizard.
  const sheetOpen = () => $('sheet').classList.contains('open');
  $('back').addEventListener('click', e => {
    if (sheetOpen()) { e.preventDefault(); closeSheet(); return; }
    if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) { e.preventDefault(); history.back(); }
  });
  function openSheet() { $('sheet').classList.add('open'); history.pushState({ sheet: 1 }, '', location.href); refresh(true, true); loadPast(); loadIncidents(); }
  function closeSheet() { if (!sheetOpen()) return; $('sheet').classList.remove('open'); if (history.state?.sheet) history.back(); }
  addEventListener('popstate', () => $('sheet').classList.remove('open'));
  $('pill').addEventListener('click', openSheet);
  $('closeSheet').addEventListener('click', closeSheet);
  $('sheet').addEventListener('click', e => { if (e.target === $('sheet')) closeSheet(); });

  async function api(path, opts = {}) {
    const r = await fetch('/troubleshoot/api/' + path, { cache: 'no-store', credentials: 'same-origin', ...opts });
    let j = {}; try { j = await r.json(); } catch {}
    if (!r.ok) throw Object.assign(new Error(j.error || j.detail || ('HTTP ' + r.status)), { body: j });
    return j;
  }
  const when = iso => new Date(iso).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

  // Status: one pill in the header, details on tap.
  let actions = {}, lastStatus = null;
  function paintStatus(s) {
    lastStatus = s; actions = s.actions || actions;
    const bad = s.checks.filter(c => !c.ok);
    $('pillDot').className = 'dot ' + (s.overall === 'ok' ? 'ok' : s.overall === 'degraded' ? 'warn' : 'bad');
    $('pillText').textContent = s.overall === 'ok' ? 'All working' : bad.length === 1 ? bad[0].label + ': problem' : bad.length + ' problems';
    $('alert').hidden = s.overall === 'ok';
    if (bad.length) $('alertText').textContent = `I can already see a problem with ${bad[0].label.replace(/^Your /, 'your ')}: ${bad[0].detail.replace(/\.$/, '').toLowerCase()}. Tap below and I'll fix it.`;
    $('checks').innerHTML = s.checks.map(c => `<div class="row"><span class="dot ${c.ok ? (c.slow ? 'warn' : 'ok') : 'bad'}"></span><div class="m">${esc(c.label)}${c.ok && !c.slow ? '' : `<div class="d">${esc(c.detail)}</div>`}</div></div>`).join('');
    $('fixes').innerHTML = Object.entries(actions).map(([k, a]) => `<button class="act" type="button" data-act="${esc(k)}">${esc(a.label)}</button>`).join('');
    if (s.accounts) {
      setEngines(s.accounts, s.engine);
      $('acct').innerHTML = s.accounts.map(a => `<div class="row"><span class="dot ${a.ok ? 'ok' : 'bad'}"></span><div class="m">${esc(a.app)}<div class="d">${esc(a.ok ? a.detail : a.detail || a.reason)}</div></div>${a.ok ? '' : `<a href="${esc(a.open)}" data-openapp="${esc(a.appId)}">Sign in</a>`}</div>`).join('');
    }
    if (s.repair && !current) openConv(s.repair.convId);
  }
  async function refresh(fresh, accounts) {
    try { paintStatus(await api('status?' + (fresh ? 'fresh=1&' : '') + (accounts ? 'accounts=1' : ''))); }
    catch { $('pillDot').className = 'dot bad'; $('pillText').textContent = 'Can\'t check'; }
  }
  async function loadIncidents() {
    try {
      const { incidents } = await api('incidents');
      const seen = new Set();
      const shown = incidents.filter(i => ['auto-fix-result', 'outage', 'recovered', 'owner-action-result'].includes(i.kind) && (i.text || i.detail))
        .filter(i => { const k = (i.text || i.detail) + when(i.at); return !seen.has(k) && seen.add(k); }).slice(0, 8);
      $('incWrap').hidden = !shown.length;
      if (shown.length) $('incidents').innerHTML = shown.map(i => `<div class="row"><span class="dot ${i.ok === false || i.kind === 'outage' ? 'bad' : 'ok'}"></span><div class="m"><div class="d">${esc(i.text || i.detail)}</div><div class="small">${esc(when(i.at))}</div></div></div>`).join('');
    } catch {}
  }
  $('fixes').addEventListener('click', async e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const a = actions[b.dataset.act] || {};
    if (!confirm(`${a.label}?${a.warn ? '\n\n' + a.warn : ''}`)) return;
    b.disabled = true; const old = b.textContent; b.textContent = 'Working…';
    try { const r = await api('action', { method: 'POST', headers: H, body: JSON.stringify({ action: b.dataset.act }) }); paintStatus(r.status); alert(r.detail); }
    catch (err) { alert(err.message); }
    finally { b.disabled = false; b.textContent = old; loadIncidents(); }
  });

  // Chat.
  let current = null, seq = 0, polling = 0, running = false;
  const log = $('log'), scroller = $('scroll');
  const toBottom = () => requestAnimationFrame(() => { scroller.scrollTop = scroller.scrollHeight; });
  function workingRow() {
    let w = log.querySelector('.working');
    if (!w) { w = document.createElement('div'); w.className = 'working'; w.innerHTML = '<span class="spin"></span><span class="step">Looking into it…</span>'; }
    log.appendChild(w); return w;
  }
  function paintEvent(ev) {
    $('welcome').hidden = true;
    if (ev.type === 'signin') {
      const d = document.createElement('div'); d.className = 'signin';
      const offer = ev.offer && NAMES[ev.offer] ? `<button class="act" type="button" data-retry="${esc(ev.offer)}">Ask ${esc(NAMES[ev.offer])} instead</button>` : '';
      d.innerHTML = `<span>${esc(ev.text)}</span><div class="acts">${ev.open ? `<a class="act" href="${esc(ev.open)}" data-openapp="${esc(ev.appId || '')}">Open ${esc(ev.app)}</a>` : ''}${offer}</div>`;
      log.insertBefore(d, log.querySelector('.working')); return toBottom();
    }
    if (ev.type === 'tool' || ev.type === 'status') {
      workingRow().querySelector('.step').textContent = ev.type === 'tool' ? 'Checking: ' + ev.text.replace(/^(Bash|Shell): /, '') : ev.text;
      return toBottom();
    }
    const d = document.createElement('div');
    if (ev.type === 'text') { d.className = 'msg ' + ev.role; d.innerHTML = ev.role === 'agent' ? `<div class="who">${esc(NAMES[ev.engine] || 'Claude')}${ev.modelLabel ? ' · ' + esc(ev.modelLabel) : ''}</div>${md(ev.text)}` : esc(ev.text.replace(/\n\n\[Automatic check right now:[^\]]*\]$/, '')); }
    else if (ev.type === 'note') {
      d.className = 'note'; d.textContent = ev.text;
      if (ev.offer && NAMES[ev.offer]) { d.className = 'signin'; d.innerHTML = `<span>${esc(ev.text)}</span><div class="acts"><button class="act" type="button" data-retry="${esc(ev.offer)}">Ask ${esc(NAMES[ev.offer])} instead</button></div>`; }
    }
    else return;
    log.insertBefore(d, log.querySelector('.working')); toBottom();
  }
  function setRunning(on) {
    running = on;
    $('send').classList.toggle('stop', on); $('send').textContent = on ? '■' : '↑'; $('send').setAttribute('aria-label', on ? 'Stop' : 'Send');
    log.querySelector('.after')?.remove();
    if (on) { workingRow(); return toBottom(); }
    log.querySelector('.working')?.remove();
    if (current && log.children.length) {
      const a = document.createElement('div'); a.className = 'after';
      a.innerHTML = '<button class="chip" type="button" data-say="Thanks, it works now.">It works now</button><button class="chip" type="button" data-say="It\'s still not working.">Still not working</button><button class="chip" type="button" data-new="1">Something else</button>';
      log.appendChild(a); toBottom();
    }
  }
  async function poll() {
    if (!current) return;
    try {
      const r = await api(`repair/${current}?since=${seq}`);
      for (const ev of r.events) { seq = ev.seq; paintEvent(ev); }
      if (r.running) { if (!running) setRunning(true); polling = setTimeout(poll, 1500); return; }
      setRunning(false); refresh(true);
    } catch { polling = setTimeout(poll, 4000); }
  }
  function openConv(id) { clearTimeout(polling); current = id; seq = 0; log.innerHTML = ''; history.replaceState(history.state, '', '#r=' + id); poll(); }
  function newChat() {
    clearTimeout(polling); current = null; seq = 0; log.innerHTML = ''; $('welcome').hidden = false;
    history.replaceState(history.state, '', location.pathname); setRunning(false); refresh(true);
  }
  async function say(message) {
    message = String(message || '').trim(); if (!message || running) return;
    // Hand the agent what the checks already know so it starts from evidence.
    const ctx = lastStatus && lastStatus.overall !== 'ok' ? `\n\n[Automatic check right now: ${lastStatus.checks.filter(c => !c.ok).map(c => `${c.label}: ${c.detail}`).join('; ')}]` : '';
    paintEvent({ type: 'text', role: 'owner', text: message }); setRunning(true);
    $('input').value = ''; autosize();
    try {
      const r = await api('repair', { method: 'POST', headers: H, body: JSON.stringify({ id: current, message: message + ctx, engine: selected || 'auto' }) });
      if (r.id !== current) { current = r.id; seq = 0; history.replaceState(history.state, '', '#r=' + r.id); }
      seq += 1; // the server's copy of our message; already painted
      poll();
    } catch (e) { setRunning(false); $('input').value = message; paintEvent({ type: 'note', text: e.message }); }
  }
  document.addEventListener('click', e => {
    // Inside the Wizard shell, open the connection app in its own window; on the bare page follow the link.
    const o = e.target.closest('[data-openapp]');
    if (o) { try { if (window.parent !== window && window.parent.WizOpenApp?.(o.dataset.openapp)) { e.preventDefault(); return; } } catch (_) {} return; }
    const c = e.target.closest('[data-say]'); if (c) return say(c.dataset.say);
    const rt = e.target.closest('[data-retry]');
    if (rt) { // the picked engine couldn't answer: switch to the offered one and ask the same question again
      const last = [...log.querySelectorAll('.msg.owner')].at(-1)?.textContent || '';
      rt.disabled = true; pick(rt.dataset.retry).then(() => say(last)); return;
    }
    if (e.target.closest('[data-new]')) newChat();
  });
  $('send').addEventListener('click', () => running ? api('repair/stop', { method: 'POST', headers: H, body: '{}' }).catch(() => {}) : say($('input').value));
  function autosize() { const t = $('input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 160) + 'px'; }
  $('input').addEventListener('input', autosize);
  $('input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && matchMedia('(pointer:fine)').matches) { e.preventDefault(); say($('input').value); } });

  async function loadPast() {
    try {
      const { repairs } = await api('repairs');
      const others = repairs.filter(r => r.id !== current).slice(0, 8);
      $('pastWrap').hidden = !others.length;
      $('past').innerHTML = others.map(r => `<button class="past" type="button" data-conv="${esc(r.id)}">${esc(r.title)}<div class="small">${esc(when(r.updatedAt))}${r.origin === 'guardian' ? ' · started automatically' : ''}</div></button>`).join('');
    } catch {}
  }
  $('past').addEventListener('click', e => { const b = e.target.closest('[data-conv]'); if (b) { closeSheet(); openConv(b.dataset.conv); } });

  const m = location.hash.match(/r=([a-f0-9]{16})/);
  if (m) openConv(m[1]);
  refresh(false, false);
  loadEngines();
  setInterval(() => { if (!document.hidden) refresh(false); }, 20000);
})();
</script>
</body>
</html>
